<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>CastSmith | 3D 预览</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #101512; color: #edf1ee; }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100dvh; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 0; padding: 8px; }
    section, .comparisons { min-width: 0; min-height: 0; }
    #motion { grid-column: 1 / -1; }
    .comparisons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; height: 100%; }
    #character, #rig, .comparison { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; border: 1px solid #35443b; border-radius: 8px; overflow: hidden; background: #151c19; }
    .preview-copy { padding: 12px 16px; }
    .preview-copy h2, .preview-copy h3 { margin: 0; font-size: 16px; }
    .preview-copy p { margin: 6px 0 0; color: #a3b0a8; font-size: 12px; line-height: 1.6; }
    .viewport { width: 100%; height: 100%; min-width: 0; min-height: 0; position: relative; overflow: hidden; touch-action: none; background: #121a16; }
    .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .error { position: absolute; inset: 12px 12px auto; z-index: 1; margin: 0; padding: 10px; background: #30211fe6; border-radius: 6px; color: #f2aca0; overflow-wrap: anywhere; font-size: 13px; line-height: 1.6; }
    .error:empty { display: none; }
    #page-error { position: fixed; z-index: 2; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    footer { padding: 8px 16px 12px; border-top: 1px solid #35443b; font-size: 12px; }
    #asset-links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin: 0; padding: 0; list-style: none; }
    #asset-links a { color: #b8dbb5; text-underline-offset: 3px; }
    #asset-links a:focus-visible { outline: 2px solid #b8dbb5; outline-offset: 3px; }
    #asset-note { margin: 8px 0 0; color: #a3b0a8; line-height: 1.6; }
  </style>
  <script type="importmap">
    {"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}
  </script>
</head>
<body>
<main>
  <p id="page-error" class="error" role="alert"></p>
  <section id="character" aria-labelledby="character-title">
    <div class="preview-copy"><h2 id="character-title">人物 3D 预览</h2><p>查看角色外观与服装。拖动旋转，滚轮缩放。</p></div>
    <div id="character-viewer" class="viewport"><p id="character-error" class="error" role="alert"></p></div>
  </section>
  <section id="rig" aria-labelledby="rig-title">
    <div class="preview-copy"><h2 id="rig-title">RigTest · 绑定测试</h2><p>角色会循环抬胳膊、抬腿。请观察肩、肘、髋、膝是否异常拉伸、扭曲，以及衣物是否穿模；这不是舞蹈动作。</p></div>
    <div id="rig-viewer" class="viewport"><p id="rig-error" class="error" role="alert"></p></div>
  </section>
  <section id="motion" aria-labelledby="motion-title">
    <h2 id="motion-title" class="sr-only">动作 3D 预览</h2>
    <div class="comparisons">
      <div class="comparison"><div class="preview-copy"><h3 id="target-title">适配后角色</h3><p>当前角色的动作适配结果。自动循环，与右侧源动作同步对照。</p></div><div id="target-viewer" class="viewport" role="group" aria-labelledby="target-title"><p id="target-error" class="error" role="alert"></p></div></div>
      <div class="comparison"><div class="preview-copy"><h3 id="source-title">SayMotion 原始动作</h3><p>SayMotion 生成的原始动作。自动循环，用于与左侧角色对照。</p></div><div id="source-viewer" class="viewport" role="group" aria-labelledby="source-title"><p id="source-error" class="error" role="alert"></p></div></div>
    </div>
  </section>
</main>
<footer aria-label="游戏资产下载">
  <ul id="asset-links"></ul>
  <p id="asset-note">暂无可下载资产。生成完成后，当前预览版本的下载链接会显示在这里。</p>
</footer>
<script type="module" src="/static/preview.js"></script>
</body>
</html>
